name: Create Release ZIP

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-zip:
    name: Build and Create ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up PHP with Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist

      - name: Install NPM dependencies and build
        run: |
          npm install
          npm run build

      - name: Create ZIP file using .distignore
        run: |
          tag="${GITHUB_REF##*/}"
          ZIP_NAME="winden-${tag}.zip"
          DIR_NAME="winden"

          mkdir -p "$DIR_NAME"
          rsync -av --exclude="$DIR_NAME" --exclude='.git' ./ "$DIR_NAME/"

          # Remove files listed in .distignore
          while IFS= read -r entry || [ -n "$entry" ]; do
            [[ -z "$entry" || "$entry" =~ ^# ]] && continue
            rm -rf "$DIR_NAME/$entry"
          done < .distignore

          zip -r "$ZIP_NAME" "$DIR_NAME"
          rm -rf "$DIR_NAME"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: winden-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.WPORG_DEPLOY_KEY }}
